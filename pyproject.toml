[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''


[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
    # `class X(str, Enum)` is this codebase's established convention for
    # every string-backed enum (used pervasively for Pydantic model
    # fields that must serialize as plain strings) - UP042's suggested
    # `enum.StrEnum` predates the codebase's Python-3.13 baseline
    # adoption and was never applied; enforcing it now would be a large,
    # non-functional rename across every model module for no behavior
    # change.
    "UP042",
]


[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]


[tool.mypy]
python_version = "3.13"
files = [
    "src",
]
exclude = [
    ".venv",
    "tests",
]
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
show_error_codes = true
pretty = true